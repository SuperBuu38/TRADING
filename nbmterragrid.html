<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terragrid Material Finder</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@400;700&family=Roboto:wght@400;700&family=Orbitron:wght@400&display=swap" rel="stylesheet">
    <style>
        :root {
            --theme-bg-primary: #0f172a; 
            --theme-bg-secondary: #1e293b; 
            --theme-bg-tertiary: #0b121e;   
            --theme-text-primary: #e2e8f0;  
            --theme-text-secondary: #94a3b8; 
            --theme-accent-primary: #0ea5e9; 
            --theme-accent-secondary: #7dd3fc; 
            --theme-accent-glow: rgba(14, 165, 233, 0.2); 
            --theme-border-primary: #0ea5e9;
            --theme-border-secondary: #334155; 
            --theme-highlight-glow: #00f0ff; 
            --theme-highlight-border: #00f0ff;
            --theme-select-arrow-fill: '%230ea5e9'; 
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--theme-bg-primary);
            color: var(--theme-text-primary);
        }
        .container-wrapper {
            max-width: 1600px;
            margin-left: auto;
            margin-right: auto;
            padding: 1rem 2rem 2rem 2rem;
        }
        h1.main-title {
            font-family: 'Exo 2', sans-serif;
            color: var(--theme-accent-primary);
            text-shadow: 0 0 3px var(--theme-accent-primary);
            font-weight: 700;
        }

        .map-area-wrapper {
            background-color: var(--theme-bg-secondary);
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 0 15px var(--theme-accent-glow);
            border: 1px solid var(--theme-border-primary);
        }

        .map-container {
            display: grid;
            grid-template-columns: 30px 1fr;
            grid-template-rows: 30px 1fr;
            gap: 1px;
            width: fit-content;
        }
        .map-header-cell {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Exo 2', sans-serif;
            font-weight: 700;
            font-size: 13px;
            background-color: var(--theme-bg-tertiary);
            color: var(--theme-accent-primary);
            border: 1px solid var(--theme-border-secondary);
        }
        .column-headers {
            grid-column: 2 / -1;
            display: grid;
            grid-template-columns: repeat(20, 40px);
            gap: 1px;
        }
        .row-headers {
            grid-row: 2 / -1;
            display: grid;
            grid-template-rows: repeat(20, 40px);
            gap: 1px;
        }
        .map-grid {
            grid-column: 2;
            grid-row: 2;
            display: grid;
            grid-template-columns: repeat(20, 40px);
            grid-template-rows: repeat(20, 40px);
            gap: 1px;
            border: 1px solid var(--theme-border-secondary);
        }
        .map-cell {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Orbitron', sans-serif;
            font-weight: bold;
            font-size: 16px;
            position: relative;
            border: 1px solid var(--theme-border-secondary);
            box-sizing: border-box;
            transition: transform 0.2s ease-out, box-shadow 0.2s ease-out;
        }
        .map-cell:hover {
            transform: scale(1.1) translateY(-1px); /* Slight lift on hover */
            box-shadow: 0 2px 15px var(--theme-accent-primary);
            z-index: 20; 
            border-color: var(--theme-accent-primary);
        }
        .tooltip {
            visibility: hidden;
            background-color: var(--theme-bg-tertiary); 
            color: var(--theme-text-primary);
            text-align: left;
            border-radius: 6px;
            padding: 10px;
            position: absolute;
            z-index: 100; 
            left: 50%;
            transform: translateX(-50%);
            min-width: 280px;
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            font-family: 'Roboto', sans-serif;
            font-size: 13px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            border: 1px solid var(--theme-accent-primary);
        }
        
        .tooltip h4 {
            font-family: 'Exo 2', sans-serif;
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--theme-accent-primary);
            font-size: 15px;
        }
        .tooltip ul { list-style-type: none; padding: 0; margin: 0; }
        .tooltip li { margin-bottom: 3px; white-space: pre; }

        .info-panel {
            background-color: var(--theme-bg-secondary);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 15px var(--theme-accent-glow);
            border: 1px solid var(--theme-border-primary);
        }
        .info-panel h3 {
            font-family: 'Exo 2', sans-serif;
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 15px;
            color: var(--theme-accent-primary);
            border-bottom: 2px solid var(--theme-border-primary);
            padding-bottom: 8px;
            text-shadow: 0 0 2px var(--theme-accent-primary);
        }
        .info-panel label {
            font-family: 'Exo 2', sans-serif;
            color: var(--theme-accent-primary);
            font-size: 1rem;
            font-weight: 700;
        }
        
        .search-input-container {
            position: relative;
            display: flex;
            align-items: center;
        }
        #materialSearchInput {
            font-family: 'Roboto', sans-serif;
            background-color: var(--theme-bg-tertiary);
            color: var(--theme-text-primary);
            border: 1px solid var(--theme-border-primary);
            border-radius: 6px;
            padding: 10px;
            width: 100%;
            box-sizing: border-box;
            padding-right: 35px; /* Space for clear button */
        }
        #clearSearchButton {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--theme-text-secondary);
            font-size: 1.5rem;
            cursor: pointer;
            padding: 0 5px;
            display: none; /* Hidden by default */
        }
        #clearSearchButton:hover {
            color: var(--theme-accent-primary);
        }

        #materialSearchInput:focus {
            outline: none;
            border-color: var(--theme-accent-secondary);
            box-shadow: 0 0 0 3px var(--theme-accent-glow);
        }
        .suggestions-container {
            position: relative; /* For absolute positioning of suggestions */
        }
        #materialSuggestions {
            position: absolute;
            background-color: var(--theme-bg-tertiary);
            border: 1px solid var(--theme-border-primary);
            border-top: none;
            border-radius: 0 0 6px 6px;
            width: 100%;
            max-height: 200px;
            overflow-y: auto;
            z-index: 90; 
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
            display: none; /* Hidden by default */
        }
        #materialSuggestions div {
            padding: 8px 12px;
            cursor: pointer;
            color: var(--theme-text-primary);
            font-family: 'Roboto', sans-serif;
        }
        #materialSuggestions div:hover {
            background-color: var(--theme-accent-primary);
            color: var(--theme-bg-primary);
        }

        .info-panel .result-item {
            padding: 10px;
            border-bottom: 1px solid var(--theme-border-secondary);
            position: relative;
            color: var(--theme-text-primary);
        }
        .info-panel .result-item:last-child { border-bottom: none; }
        .info-panel .result-item:hover { background-color: var(--theme-bg-tertiary); }

        .highlight-search {
            /* outline: 3px solid var(--theme-highlight-border) !important; */
            /* outline-offset: -3px;  */
            border: 2px solid var(--theme-highlight-border) !important;
            transform: translateY(-2px) scale(1.03); /* Raised effect */
            box-shadow: 0 3px 6px rgba(0,0,0,0.4), 0 0 8px var(--theme-highlight-glow), 0 0 15px var(--theme-highlight-glow); /* Shadow for raised effect */
            z-index: 10; /* Ensure highlighted cells are above non-highlighted ones */
        }

        .flash-once {
            animation: shortFlash 0.7s 1 ease-out;
        }
        @keyframes shortFlash {
            0%, 100% { 
                /* Keep existing highlight if present */
                filter: brightness(1);
            }
            50% { 
                filter: brightness(1.8) drop-shadow(0 0 8px yellow);
                transform: scale(1.1) translateY(-1px); 
            }
        }
        .clickable-position, .clickable-zone {
            padding: 2px 5px;
            margin: 0 2px;
            border-radius: 3px;
            transition: background-color 0.2s, color 0.2s;
            cursor: pointer;
        }
        .clickable-position:hover, .clickable-zone:hover {
            background-color: var(--theme-accent-primary);
            color: var(--theme-bg-primary);
        }
        
        .loading-message, .error-message {
            text-align: center;
            padding: 20px;
            font-size: 1.1rem;
            color: var(--theme-accent-primary);
            font-family: 'Exo 2', sans-serif;
        }
        .error-message { color: #ef4444; }

        .corner-spacer {
            grid-column: 1;
            grid-row: 1;
            background-color: var(--theme-bg-tertiary);
            border: 1px solid var(--theme-border-secondary);
        }

        .header-controls { 
            display: flex;
            justify-content: center; 
            align-items: center;
            margin-bottom: 1.5rem;
        }
        .app-footer {
            text-align: center;
            padding: 20px 0;
            margin-top: 30px;
            font-family: 'Exo 2', sans-serif;
            font-size: 0.9rem;
            color: var(--theme-text-secondary);
            border-top: 1px solid var(--theme-border-secondary);
        }
    </style>
</head>
<body class="p-0 theme-cyber"> 
    <div class="container-wrapper">
        <div class="header-controls">
            <h1 class="main-title text-4xl font-bold">Terragrid Material Finder</h1>
        </div>

        <div class="flex flex-col lg:flex-row gap-8">
            <div class="flex-shrink-0 mx-auto lg:mx-0">
                <div class="map-area-wrapper">
                    <div id="mapContainer" class="map-container">
                        <div class="corner-spacer"></div>
                        <div id="columnHeaders" class="column-headers"></div>
                        <div id="rowHeaders" class="row-headers"></div>
                        <div id="mapGrid" class="map-grid">
                             <div class="loading-message col-span-20 row-span-20 flex items-center justify-center">Loading map data...</div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex-grow info-panel">
                <div>
                    <h3 class="pb-2 mb-4">Material Search</h3>
                    <div class="mb-1"> 
                        <label for="materialSearchInput" class="block text-sm font-medium mb-2">Search for a material:</label>
                        <div class="search-input-container">
                            <input type="text" id="materialSearchInput" class="mt-1 block w-full text-base shadow-sm" placeholder="Type to search materials...">
                            <button id="clearSearchButton" title="Clear search">&times;</button>
                        </div>
                        <div class="suggestions-container">
                            <div id="materialSuggestions"></div>
                        </div>
                    </div>
                    <div id="materialSearchResults" class="text-sm space-y-2 bg-opacity-50 bg-black p-4 rounded-md border var(--theme-border-secondary) mt-4">
                        <p><strong>Material:</strong> <span id="selectedMaterialName" class="font-bold">-</span></p>
                        <p><strong>Positions:</strong> <span id="selectedMaterialPositions" class="font-bold leading-relaxed">-</span></p> 
                        <p><strong>Zones:</strong> <span id="selectedMaterialZones" class="font-bold leading-relaxed">-</span></p>
                    </div>
                </div>

                <div class="mt-8">
                    <h3 class="pb-2 mb-4">Top 3 Richest Zones</h3>
                    <div id="topRichestZones" class="space-y-1 text-sm">
                        <p class="loading-message">Loading statistics...</p>
                    </div>
                </div>

                <div class="mt-8">
                    <h3 class="pb-2 mb-4">Best Zones by Rarity</h3>
                    <div id="bestZonesByRarity" class="space-y-1 text-sm">
                         <p class="loading-message">Loading statistics...</p>
                    </div>
                </div>
                
                <div class="mt-8">
                    <h3 class="pb-2 mb-4">Top Zones by Material Value</h3>
                    <div id="topZonesByValue" class="space-y-1 text-sm">
                         <p class="loading-message">Loading statistics...</p>
                    </div>
                </div>
            </div>
        </div>
        <footer class="app-footer">
            Made by SuperBuu
        </footer>
    </div>

    <script>
        // Generate unique colors for biomes - now using predefined colors
        function generateUniqueColors(count) {
            // This function is now obsolete since we use predefined colors
            // but keeping it for backward compatibility
            return [];
        }

        // Create biome lookup map - will be populated from fetched data
        const biomeMap = {};
        
        // We'll build this dynamically from biomes_data.json
        let cellToBiomeMap = {};

        let logsData = []; 
        const rarityOrder = { "Common": 1, "Rare": 2, "Epic": 3, "Legendary": 4, "Ultimate": 5 };
        const rarityEmojis = { "Common": "🔵", "Rare": "🟢", "Epic": "🔴", "Legendary": "🟠", "Ultimate": "🟣" };
        const rarityPoints = { Common: 1, Rare: 2, Epic: 3, Legendary: 4, Ultimate: 5 };
        let cellMaterials = {}; 
        let allMaterials = new Set(); 
        let sortedMaterialsCache = [];

        function cellToIndices(cellAddress) { const col = cellAddress.charCodeAt(0) - 65; const row = parseInt(cellAddress.substring(1)) - 1; return { row, col }; }
        function indicesToCell(row, col) { return String.fromCharCode(65 + col) + (row + 1); }
        
        function processLogData() {
            if (!logsData || logsData.length === 0) { console.warn("No log data to process."); return; }
            logsData.forEach(materialEntry => {
                const fullMaterialName = `${materialEntry.name}, ${materialEntry.rarity}`;
                allMaterials.add(fullMaterialName);
                if (materialEntry.locations && Array.isArray(materialEntry.locations)) {
                    materialEntry.locations.forEach(location => {
                        if (!cellMaterials[location]) cellMaterials[location] = [];
                        if (!cellMaterials[location].includes(fullMaterialName)) cellMaterials[location].push(fullMaterialName);
                    });
                }
            });
            sortedMaterialsCache = Array.from(allMaterials).sort(); 
        }

        function createBiomeMap() { 
            const mapGrid = document.getElementById('mapGrid');
            const columnHeadersDiv = document.getElementById('columnHeaders');
            const rowHeadersDiv = document.getElementById('rowHeaders');
            mapGrid.innerHTML = ''; columnHeadersDiv.innerHTML = ''; rowHeadersDiv.innerHTML = '';
            for (let col = 0; col < 20; col++) { const headerCell = document.createElement('div'); headerCell.classList.add('map-header-cell'); headerCell.textContent = String.fromCharCode(65 + col); columnHeadersDiv.appendChild(headerCell); }
            for (let row = 0; row < 20; row++) { const headerCell = document.createElement('div'); headerCell.classList.add('map-header-cell'); headerCell.textContent = row + 1; rowHeadersDiv.appendChild(headerCell); }

            for (let row = 0; row < 20; row++) {
                for (let col = 0; col < 20; col++) {
                    const cellElement = document.createElement('div'); cellElement.classList.add('map-cell'); cellElement.dataset.row = row; cellElement.dataset.col = col;
                    const cellAddress = indicesToCell(row, col); cellElement.id = `cell-${cellAddress}`;
                    
                    const biomeName = cellToBiomeMap[cellAddress]; 
                    const biome = biomeMap[biomeName]; 
                    if (!biome) { 
                        console.error(`Biome undefined for name: ${biomeName} at ${cellAddress}`);
                        cellElement.style.backgroundColor = 'pink'; 
                        cellElement.textContent = 'ERR';
                        mapGrid.appendChild(cellElement);
                        continue; 
                    }
                    cellElement.style.backgroundColor = biome.color;
                    const bgColor = biome.color.startsWith('#') ? biome.color : '#FFFFFF'; const r = parseInt(bgColor.slice(1, 3), 16); const g = parseInt(bgColor.slice(3, 5), 16); const b = parseInt(bgColor.slice(5, 7), 16);
                    const luminance = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
                    const currentThemeBg = getComputedStyle(document.body).getPropertyValue('--theme-bg-primary').trim();
                    cellElement.style.color = luminance > 0.5 ? currentThemeBg : '#FFFFFF';
                    const materialsInCell = cellMaterials[cellAddress] || []; const uniqueMaterialsInCell = [...new Set(materialsInCell)];
                    cellElement.textContent = uniqueMaterialsInCell.length > 0 ? uniqueMaterialsInCell.length : '';
                    const tooltipElement = document.createElement('div'); tooltipElement.classList.add('tooltip');
                    let tooltipContent = `<h4>${biome.name}</h4>`;
                    if (uniqueMaterialsInCell.length > 0) {
                        tooltipContent += '<ul>';
                        uniqueMaterialsInCell.sort((a, b) => (rarityOrder[a.split(", ")[1].trim()] || 0) - (rarityOrder[b.split(", ")[1].trim()] || 0));
                        uniqueMaterialsInCell.forEach(materialStr => {
                            const rarity = materialStr.split(", ")[1].trim(); const emoji = rarityEmojis[rarity] || '❓';
                            tooltipContent += `<li>${emoji} ${materialStr}</li>`;
                        });
                        tooltipContent += '</ul>';
                    } else { tooltipContent += '<p>No materials found.</p>'; }
                    tooltipElement.innerHTML = tooltipContent; cellElement.appendChild(tooltipElement);
                    cellElement.addEventListener('mouseenter', (event) => { 
                        const cellRect = event.currentTarget.getBoundingClientRect();
                        tooltipElement.style.visibility = 'hidden'; tooltipElement.style.opacity = '0'; tooltipElement.style.display = 'block'; 
                        const tooltipHeight = tooltipElement.offsetHeight; tooltipElement.style.display = ''; 
                        tooltipElement.style.visibility = 'visible'; tooltipElement.style.opacity = '1';
                        if (cellRect.top < tooltipHeight + 10) { tooltipElement.style.bottom = 'auto'; tooltipElement.style.top = '100%'; tooltipElement.style.transform = 'translateX(-50%) translateY(10px)';
                        } else { tooltipElement.style.top = 'auto'; tooltipElement.style.bottom = '125%'; tooltipElement.style.transform = 'translateX(-50%) translateY(-5px)'; }
                    });
                    cellElement.addEventListener('mouseleave', () => { tooltipElement.style.visibility = 'hidden'; tooltipElement.style.opacity = '0'; });
                    mapGrid.appendChild(cellElement);
                }
            }
        }
        
        function setupMaterialSearchInput() {
            const searchInput = document.getElementById('materialSearchInput');
            const suggestionsDiv = document.getElementById('materialSuggestions');
            const clearButton = document.getElementById('clearSearchButton');
            
            searchInput.addEventListener('input', function() {
                const query = this.value.toLowerCase();
                suggestionsDiv.innerHTML = ''; 
                if (query.length > 0) {
                    clearButton.style.display = 'inline'; // Show clear button
                    const filteredMaterials = sortedMaterialsCache.filter(material => 
                        material.toLowerCase().includes(query)
                    );
                    if (filteredMaterials.length > 0) {
                        suggestionsDiv.style.display = 'block';
                        filteredMaterials.slice(0, 10).forEach(materialString => { 
                            const suggestionItem = document.createElement('div');
                            const parts = materialString.split(', ');
                            const rarity = parts[1] ? parts[1].trim() : "Common";
                            const emoji = rarityEmojis[rarity] || '❓';
                            suggestionItem.innerHTML = `${emoji} ${materialString}`; 
                            suggestionItem.addEventListener('click', function() {
                                searchInput.value = materialString; 
                                suggestionsDiv.innerHTML = '';
                                suggestionsDiv.style.display = 'none';
                                displayMaterialInfo(materialString); 
                            });
                            suggestionsDiv.appendChild(suggestionItem);
                        });
                    } else {
                        suggestionsDiv.style.display = 'none';
                    }
                } else {
                    suggestionsDiv.style.display = 'none';
                    clearButton.style.display = 'none'; // Hide clear button
                    resetSearch(); // Clear results if input is empty
                }
            });

            clearButton.addEventListener('click', function() {
                searchInput.value = '';
                suggestionsDiv.innerHTML = '';
                suggestionsDiv.style.display = 'none';
                clearButton.style.display = 'none';
                resetSearch();
            });

            document.addEventListener('click', function(event) {
                if (!searchInput.contains(event.target) && !suggestionsDiv.contains(event.target) && event.target !== clearButton) {
                    suggestionsDiv.style.display = 'none';
                }
            });
        }

        function resetSearch() {
            document.getElementById('selectedMaterialName').textContent = '-';
            document.getElementById('selectedMaterialPositions').textContent = '-';
            document.getElementById('selectedMaterialZones').textContent = '-';
            document.querySelectorAll('.map-cell.highlight-search').forEach(cell => {
                cell.classList.remove('highlight-search');
            });
        }


        function flashCellOnMap(cellAddress) {
            const cellElement = document.getElementById(`cell-${cellAddress}`);
            if (cellElement) {
                // Temporarily remove highlight-search if present to ensure flash is visible
                const wasHighlighted = cellElement.classList.contains('highlight-search');
                if (wasHighlighted) cellElement.classList.remove('highlight-search');
                
                cellElement.classList.add('flash-once');
                
                setTimeout(() => {
                    cellElement.classList.remove('flash-once');
                    // Re-apply highlight-search if it was there before flashing
                    if (wasHighlighted) cellElement.classList.add('highlight-search');
                }, 700); // Match animation duration + a little buffer
            }
        }
        
        function highlightBiomeCells(biomeNameToHighlight) {
            // Clear previous highlights (both material and biome-specific)
            document.querySelectorAll('.map-cell.highlight-search').forEach(cell => {
                cell.classList.remove('highlight-search');
            });

            for (let r = 0; r < 20; r++) {
                for (let c = 0; c < 20; c++) {
                    const biomeName = cellToBiomeMap[indicesToCell(r, c)];
                    if (biomeName === biomeNameToHighlight) {
                        const cellAddress = indicesToCell(r, c);
                        const cellElement = document.getElementById(`cell-${cellAddress}`);
                        if (cellElement) {
                            cellElement.classList.add('highlight-search');
                        }
                    }
                }
            }
        }


        function displayMaterialInfo(selectedMaterial) {
            const nameSpan = document.getElementById('selectedMaterialName');
            const positionsContainer = document.getElementById('selectedMaterialPositions'); 
            const zonesContainer = document.getElementById('selectedMaterialZones'); // Changed to container

            // Clear previous biome highlights before applying new material highlights
            document.querySelectorAll('.map-cell.highlight-search').forEach(cell => {
                cell.classList.remove('highlight-search');
            });


            if (!selectedMaterial) {
                nameSpan.textContent = '-';
                positionsContainer.textContent = '-';
                zonesContainer.textContent = '-';
                return;
            }
            
            const parts = selectedMaterial.split(', ');
            const materialNameOnly = parts[0];
            const rarity = parts[1] ? parts[1].trim() : "";
            const emojiForDisplay = rarityEmojis[rarity] || '';
            nameSpan.innerHTML = `${emojiForDisplay} ${materialNameOnly}${rarity ? ', ' + rarity : ''}`;

            const positions = [];
            const uniqueZoneNames = new Set(); // Use Set for unique zone names

            for (const cellAddress in cellMaterials) {
                if (cellMaterials[cellAddress].includes(selectedMaterial)) { 
                    positions.push(cellAddress);
                    const { row, col } = cellToIndices(cellAddress);
                    if (row >= 0 && row < 20 && col >= 0 && col < 20) {
                        const biomeName = cellToBiomeMap[cellAddress];
                        const biome = biomeMap[biomeName];
                        if (biome) uniqueZoneNames.add(biome.name);
                        const cellElement = document.getElementById(`cell-${cellAddress}`);
                        if (cellElement) cellElement.classList.add('highlight-search');
                    }
                }
            }
            
            positionsContainer.innerHTML = ''; 
            if (positions.length > 0) {
                positions.forEach((pos, index) => {
                    const posElement = document.createElement('span');
                    posElement.textContent = pos;
                    posElement.classList.add('clickable-position'); // Removed cursor-pointer, handled by hover
                    posElement.title = `Click to highlight ${pos} on map`;
                    posElement.addEventListener('click', () => flashCellOnMap(pos));
                    positionsContainer.appendChild(posElement);
                    if (index < positions.length - 1) { 
                         const separator = document.createTextNode(', ');
                         positionsContainer.appendChild(separator);
                    }
                });
            } else {
                positionsContainer.textContent = 'None';
            }

            zonesContainer.innerHTML = ''; // Clear previous zones
            if (uniqueZoneNames.size > 0) {
                Array.from(uniqueZoneNames).forEach((zoneName, index, arr) => {
                    const zoneElement = document.createElement('span');
                    zoneElement.textContent = zoneName;
                    zoneElement.classList.add('clickable-zone');
                    zoneElement.title = `Click to highlight all '${zoneName}' cells`;
                    zoneElement.addEventListener('click', () => {
                        // When a zone is clicked, also clear material name and positions from display
                        // as the focus is now on the whole biome.
                        document.getElementById('materialSearchInput').value = ''; // Clear search input
                        document.getElementById('clearSearchButton').style.display = 'none';
                        document.getElementById('materialSuggestions').style.display = 'none';
                        nameSpan.textContent = '-'; 
                        positionsContainer.textContent = '-';
                        zonesContainer.innerHTML = ''; // Clear current zone list to avoid self-reference issues
                        const tempZoneSpan = document.createElement('span'); // Re-add the clicked zone name simply
                        tempZoneSpan.textContent = zoneName;
                        zonesContainer.appendChild(tempZoneSpan);

                        highlightBiomeCells(zoneName);
                    });
                    zonesContainer.appendChild(zoneElement);
                    if (index < arr.length - 1) {
                        const separator = document.createTextNode(', ');
                        zonesContainer.appendChild(separator);
                    }
                });
            } else {
                zonesContainer.textContent = 'None';
            }
        }

        function calculateAndDisplayZoneStats() { 
            const biomeMaterialStats = {}; 
            for (const cellAddress in cellMaterials) { const materialsInCell = cellMaterials[cellAddress]; const { row, col } = cellToIndices(cellAddress); if (row >= 0 && row < 20 && col >= 0 && col < 20) { const biomeName = cellToBiomeMap[cellAddress]; const currentBiome = biomeMap[biomeName]; if (currentBiome) { if (!biomeMaterialStats[currentBiome.name]) { biomeMaterialStats[currentBiome.name] = { materials: new Set(), rarityStats: { Common: new Set(), Rare: new Set(), Epic: new Set(), Legendary: new Set(), Ultimate: new Set() }, totalValue: 0, countedForValue: new Set() }; } const biomeStat = biomeMaterialStats[currentBiome.name]; materialsInCell.forEach(materialStr => { biomeStat.materials.add(materialStr); const rarity = materialStr.split(", ")[1].trim(); if (biomeStat.rarityStats[rarity]) biomeStat.rarityStats[rarity].add(materialStr); if (!biomeStat.countedForValue.has(materialStr)) { biomeStat.totalValue += rarityPoints[rarity] || 0; biomeStat.countedForValue.add(materialStr); } }); } } }
            const biomeStatsArray = Object.entries(biomeMaterialStats).map(([name, data]) => ({ name, materialCount: data.materials.size, materials: Array.from(data.materials).sort((a,b) => { const rA = rarityOrder[a.split(", ")[1].trim()]||0; const rB = rarityOrder[b.split(", ")[1].trim()]||0; return rA !== rB ? rA - rB : a.localeCompare(b); }), rarityStats: data.rarityStats, totalValue: data.totalValue }));
            
            const topRichestZonesDiv = document.getElementById('topRichestZones'); topRichestZonesDiv.innerHTML = ''; biomeStatsArray.sort((a, b) => b.materialCount - a.materialCount); if (biomeStatsArray.length === 0) topRichestZonesDiv.innerHTML = '<p class="text-gray-400">No zone data to display.</p>';
            for (let i = 0; i < Math.min(3, biomeStatsArray.length); i++) { const biome = biomeStatsArray[i]; const tooltipDetail = `Zone: ${biome.name}\nTotal Unique Materials: ${biome.materialCount}\n\nMaterials Found:\n` + biome.materials.map(m => `${rarityEmojis[m.split(", ")[1].trim()] || '❓'} ${m}`).join('\n'); const itemDiv = createStatItemDiv(`${i + 1}. ${biome.name} (${biome.materialCount} materials)`, tooltipDetail); topRichestZonesDiv.appendChild(itemDiv); }
            
            const bestZonesByRarityDiv = document.getElementById('bestZonesByRarity'); bestZonesByRarityDiv.innerHTML = ''; const raritiesToDisplay = ["Common", "Rare", "Epic", "Legendary", "Ultimate"]; let displayedRarityStat = false;
            raritiesToDisplay.forEach(rarity => { let bestZoneForRarity = null; let maxCount = 0; biomeStatsArray.forEach(biome => { const count = biome.rarityStats[rarity] ? biome.rarityStats[rarity].size : 0; if (count > maxCount) { maxCount = count; bestZoneForRarity = biome; } }); if (bestZoneForRarity && maxCount > 0) { displayedRarityStat = true; const materialsOfRarity = Array.from(bestZoneForRarity.rarityStats[rarity]).sort(); const tooltipDetail = `Best Zone for ${rarity} Materials:\n${bestZoneForRarity.name}\n\n${rarity} Materials (${materialsOfRarity.length}):\n` + materialsOfRarity.map(m => `${rarityEmojis[rarity] || '❓'} ${m}`).join('\n'); const itemDiv = createStatItemDiv(`${rarityEmojis[rarity] || '❓'} ${rarity}: ${bestZoneForRarity.name} (${maxCount} materials)`, tooltipDetail); bestZonesByRarityDiv.appendChild(itemDiv); } });
            if (!displayedRarityStat && biomeStatsArray.length > 0) bestZonesByRarityDiv.innerHTML = '<p class="text-gray-400">No rarity data to display.</p>'; else if (biomeStatsArray.length === 0) bestZonesByRarityDiv.innerHTML = '<p class="text-gray-400">No zone data to display.</p>';
            
            const topZonesByValueDiv = document.getElementById('topZonesByValue'); topZonesByValueDiv.innerHTML = ''; biomeStatsArray.sort((a,b) => b.totalValue - a.totalValue); if (biomeStatsArray.length === 0) topZonesByValueDiv.innerHTML = '<p class="text-gray-400">No zone data to display.</p>'; let displayedValueStat = false;
            for (let i = 0; i < Math.min(3, biomeStatsArray.length); i++) { const biome = biomeStatsArray[i]; if (biome.totalValue > 0) { displayedValueStat = true; let valueNote = `Zone: ${biome.name}\nTotal Value: ${biome.totalValue} pts\n\nValue Breakdown by Rarity:\n`; raritiesToDisplay.forEach(r => { const count = biome.rarityStats[r] ? biome.rarityStats[r].size : 0; if (count > 0) valueNote += `${rarityEmojis[r] || '❓'} ${r}: ${count} materials (${count * (rarityPoints[r]||0)} pts)\n`; }); valueNote += "\n\nAll Materials in this Zone (sorted by rarity):\n" + biome.materials.map(m => `${rarityEmojis[m.split(", ")[1].trim()] || '❓'} ${m}`).join('\n'); const itemDiv = createStatItemDiv(`${i + 1}. ${biome.name} (${biome.totalValue} pts)`, valueNote); topZonesByValueDiv.appendChild(itemDiv); } }
            if (!displayedValueStat && biomeStatsArray.length > 0 && biomeStatsArray.some(b => b.totalValue > 0)) {} else if (!biomeStatsArray.some(b => b.totalValue > 0) && biomeStatsArray.length > 0) topZonesByValueDiv.innerHTML = '<p class="text-gray-400">No zones with significant material value.</p>';
        }

        function createStatItemDiv(displayText, tooltipText) { 
            const itemDiv = document.createElement('div'); itemDiv.classList.add('result-item', 'p-3', 'cursor-default', 'rounded-md'); itemDiv.style.color = 'var(--theme-text-primary)'; itemDiv.innerHTML = displayText; 
            const tooltipElement = document.createElement('div'); tooltipElement.classList.add('tooltip'); tooltipElement.style.whiteSpace = 'pre-wrap'; tooltipElement.style.fontSize = '12px'; tooltipElement.textContent = tooltipText; itemDiv.appendChild(tooltipElement);
            itemDiv.addEventListener('mouseenter', (event) => { itemDiv.style.backgroundColor = getComputedStyle(document.body).getPropertyValue('--theme-bg-tertiary');
                const itemRect = event.currentTarget.getBoundingClientRect(); tooltipElement.style.visibility = 'hidden'; tooltipElement.style.opacity = '0'; tooltipElement.style.display = 'block'; 
                const tooltipHeight = tooltipElement.offsetHeight; tooltipElement.style.display = ''; tooltipElement.style.visibility = 'visible'; tooltipElement.style.opacity = '1';
                if (itemRect.top < tooltipHeight + 10 && (itemRect.bottom + tooltipHeight + 10) > window.innerHeight) { tooltipElement.style.top = 'auto'; tooltipElement.style.bottom = '105%'; tooltipElement.style.transform = 'translateX(-50%) translateY(-5px)';
                } else if (itemRect.top < tooltipHeight + 10) { tooltipElement.style.bottom = 'auto'; tooltipElement.style.top = '100%'; tooltipElement.style.transform = 'translateX(-50%) translateY(10px)';
                } else { tooltipElement.style.top = 'auto'; tooltipElement.style.bottom = '105%'; tooltipElement.style.transform = 'translateX(-50%) translateY(-5px)'; }
            });
            itemDiv.addEventListener('mouseleave', () => { itemDiv.style.backgroundColor = 'transparent'; tooltipElement.style.visibility = 'hidden'; tooltipElement.style.opacity = '0'; });
            return itemDiv;
        }

        async function initializeApp() {
            const mapGridElement = document.getElementById('mapGrid'); 

            if (!document.body.classList.contains('theme-cyber')) {
                document.body.classList.add('theme-cyber');
            }

            try {
                
                const logDataUrl = 'https://raw.githubusercontent.com/SuperBuu38/superbuu/SuperBuu38-patch-1/biomes_data.json';
                const response = await fetch(logDataUrl);
                if (!response.ok) throw new Error(`HTTP Error! Status: ${response.status}`);
                const biomesData = await response.json();
                
                // Transform biomes data to the expected format
                logsData = transformBiomesData(biomesData);
                
                processLogData();
                createBiomeMap(); 
                setupMaterialSearchInput(); 
                calculateAndDisplayZoneStats(); 

            } catch (error) {
                console.error("Could not load log data:", error);
                mapGridElement.innerHTML = `<div class="error-message col-span-20 row-span-20 flex items-center justify-center">Error loading map data: ${error.message}</div>`;
                const searchInput = document.getElementById('materialSearchInput');
                if(searchInput) searchInput.placeholder = "Error loading materials...";
                document.getElementById('topRichestZones').innerHTML = '<p class="error-message">Error loading statistics.</p>';
                document.getElementById('bestZonesByRarity').innerHTML = '<p class="error-message">Error loading statistics.</p>';
                document.getElementById('topZonesByValue').innerHTML = '<p class="error-message">Error loading statistics.</p>';
            }
        }

        function transformBiomesData(biomesData) {
            const materialMap = new Map();
            
            // Build cell to biome mapping and populate biomeMap
            cellToBiomeMap = {};
            
            // Process each biome
            biomesData.forEach(biome => {
                // Populate biomeMap with fetched data
                biomeMap[biome.name] = {
                    id: biome.id,
                    name: biome.name,
                    size: biome.size,
                    cells: biome.cells,
                    mats: biome.mats,
                    color: biome.color // Use the predefined color from the data
                };
                
                // Map cells to biome names
                if (biome.cells) {
                    biome.cells.forEach(cell => {
                        cellToBiomeMap[cell] = biome.name;
                    });
                }
                
                // Process materials
                if (biome.mats && biome.cells) {
                    biome.mats.forEach(materialName => {
                        if (!materialMap.has(materialName)) {
                            materialMap.set(materialName, {
                                name: materialName,
                                rarity: "Common", // Will be updated later
                                locations: []
                            });
                        }
                        
                        // Add all cells from this biome to the material's locations
                        const material = materialMap.get(materialName);
                        biome.cells.forEach(cell => {
                            if (!material.locations.includes(cell)) {
                                material.locations.push(cell);
                            }
                        });
                    });
                }
            });
            
            // Assign rarities based on material distribution and names
            const materials = Array.from(materialMap.values());
            materials.forEach(material => {
                material.rarity = assignRarity(material.name, material.locations.length);
            });
            
            return materials;
        }

        function assignRarity(materialName, locationCount) {
            const name = materialName.toLowerCase();
            
            // Ultimate rarity keywords
            if (name.includes('queen') || name.includes('emperor') || name.includes('forbidden') || 
                name.includes('antimatter') || name.includes('crystallic') || name.includes('ultimate')) {
                return "Ultimate";
            }
            
            // Legendary rarity keywords
            if (name.includes('legendary') || name.includes('cosmic') || name.includes('astral') || 
                name.includes('anti-gravity') || name.includes('deep killer') || name.includes('mackerel') ||
                name.includes('apertian') && (name.includes('mouse') || name.includes('queen')) ||
                name.includes('hydrostinger') || name.includes('calipseum') || name.includes('ignis flamis')) {
                return "Legendary";
            }
            
            // Epic rarity keywords
            if (name.includes('epic') || name.includes('tornado') || name.includes('singing king') ||
                name.includes('asymmetric') || name.includes('flying snake') || name.includes('alien') ||
                name.includes('premium') || name.includes('royal') || name.includes('exotic') ||
                name.includes('glowing') && (name.includes('spider') || name.includes('stars')) ||
                name.includes('apertian') && name.includes('green')) {
                return "Epic";
            }
            
            // Rare rarity keywords
            if (name.includes('rare') || name.includes('uncommon') || name.includes('strange') ||
                name.includes('liquid') || name.includes('fermented') || name.includes('poisonous') ||
                name.includes('firework') || name.includes('mantis') || name.includes('unstable') ||
                name.includes('algea') || name.includes('anemona') || name.includes('milky') ||
                name.includes('thorns') || locationCount <= 3) {
                return "Rare";
            }
            
            // Everything else is Common
            return "Common";
        }

        document.addEventListener('DOMContentLoaded', initializeApp);
    </script>
