<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFT Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-7xl mx-auto p-6">
    <div id="error" class="hidden text-center text-red-500 text-xl mb-4"></div>
    <div id="loading" class="text-center text-2xl text-gray-600">Loading...</div>
    <div id="table-container" class="hidden bg-white shadow-xl rounded-lg p-8">
      <h1 class="text-3xl font-bold mb-6 text-center text-gray-800">NFT Marketplace</h1>
      <div class="overflow-x-auto">
        <table id="nft-table" class="w-full table-auto border-collapse">
          <thead class="bg-gray-200">
            <tr>
              <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700 uppercase tracking-wider cursor-pointer" onclick="sortTable('rarity')">Rarity <span id="sort-rarity"></span></th>
              <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700 uppercase tracking-wider cursor-pointer" onclick="sortTable('level')">Level <span id="sort-level"></span></th>
              <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700 uppercase tracking-wider cursor-pointer" onclick="sortTable('name')">Name <span id="sort-name"></span></th>
              <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700 uppercase tracking-wider cursor-pointer" onclick="sortTable('price')">Price <span id="sort-price"></span></th>
              <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700 uppercase tracking-wider">Seller</th>
              <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700 uppercase tracking-wider">Sale ID</th>
              <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700 uppercase tracking-wider">Timestamp</th>
              <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700 uppercase tracking-wider">Status</th>
              <th class="px-6 py-3 text-left text-sm font-semibold text-gray-700 uppercase tracking-wider">Link</th>
            </tr>
          </thead>
          <tbody id="nft-table-body"></tbody>
        </table>
      </div>
    </div>
  </div>
  <script>
    let nfts = [];
    let sortConfig = { key: 'rarity', direction: 'asc' };

    // Fetch JSON data
    function fetchData() {
      const loading = document.getElementById('loading');
      const error = document.getElementById('error');
      const tableContainer = document.getElementById('table-container');

      fetch('https://raw.githubusercontent.com/SuperBuu38/superbuu/SuperBuu38-patch-1/data.json')
        .then(response => {
          if (!response.ok) throw new Error('Failed to fetch data');
          return response.json();
        })
        .then(data => {
          nfts = data;
          sortTable('rarity'); // Default sort by rarity
          loading.classList.add('hidden');
          tableContainer.classList.remove('hidden');
        })
        .catch(err => {
          loading.classList.add('hidden');
          error.classList.remove('hidden');
          error.textContent = `Error: ${err.message}`;
        });
    }

    // Render table
    function renderTable() {
      const tbody = document.getElementById('nft-table-body');
      tbody.innerHTML = '';

      nfts.forEach((nft, index) => {
        const row = document.createElement('tr');
        row.className = index % 2 === 0 ? 'bg-gray-50' : 'bg-white';
        row.innerHTML = `
          <td class="border-t px-6 py-4 text-gray-900">${nft.rarity}</td>
          <td class="border-t px-6 py-4 text-gray-900">${nft.level}</td>
          <td class="border-t px-6 py-4 text-gray-900">${nft.name}</td>
          <td class="border-t px-6 py-4 text-gray-900">${parseFloat(nft.price).toFixed(4)}</td>
          <td class="border-t px-6 py-4 text-gray-900">${nft.seller}</td>
          <td class="border-t px-6 py-4 text-gray-900">${nft.sale_id}</td>
          <td class="border-t px-6 py-4 text-gray-900">${new Date(nft.timestamp).toLocaleString()}</td>
          <td class="border-t px-6 py-4 text-gray-900">${nft.status}</td>
          <td class="border-t px-6 py-4">
            <a href="${nft.sale_link}" class="text-blue-600 hover:text-blue-800 hover:underline" target="_blank" rel="noopener noreferrer">View Sale</a>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    // Sort table
    function sortTable(key) {
      const direction = sortConfig.key === key && sortConfig.direction === 'asc' ? 'desc' : 'asc';
      sortConfig = { key, direction };

      // Update sort indicators
      ['rarity', 'level', 'name', 'price'].forEach(k => {
        const indicator = document.getElementById(`sort-${k}`);
        indicator.textContent = k === key ? (direction === 'asc' ? '▲' : '▼') : '';
      });

      // Sort data
      nfts.sort((a, b) => {
        if (key === 'price' || key === 'level') {
          return direction === 'asc'
            ? parseFloat(a[key]) - parseFloat(b[key])
            : parseFloat(b[key]) - parseFloat(a[key]);
        }
        return direction === 'asc'
          ? a[key].localeCompare(b[key])
          : b[key].localeCompare(a[key]);
      });

      renderTable();
    }

    // Initialize
    fetchData();
  </script>
</body>
</html>
