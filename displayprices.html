<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFT Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/babel-standalone@7/babel.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div id="root" class="w-full max-w-6xl mx-auto p-4"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const App = () => {
      const [nfts, setNfts] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [pat, setPat] = useState('');
      const [workflowStatus, setWorkflowStatus] = useState('');
      const [sortConfig, setSortConfig] = useState({ key: 'rarity', direction: 'asc' });

      // Fetch JSON data
      const fetchData = async () => {
        try {
          setLoading(true);
          const response = await fetch('https://raw.githubusercontent.com/SuperBuu38/superbuu/SuperBuu38-patch-1/data.json');
          if (!response.ok) throw new Error('Failed to fetch data');
          const data = await response.json();
          setNfts(data);
          setLoading(false);
        } catch (err) {
          setError(err.message);
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchData();
      }, []);

      // Trigger GitHub Actions workflow
      const triggerWorkflow = async () => {
        if (!pat) {
          setWorkflowStatus('Please enter a Personal Access Token');
          return;
        }
        setWorkflowStatus('Triggering workflow...');
        try {
          const response = await fetch(
            'https://api.github.com/repos/SuperBuu38/superbuu/actions/workflows/extract-json.yml/dispatches',
            {
              method: 'POST',
              headers: {
                'Authorization': `Bearer ${pat}`,
                'Accept': 'application/vnd.github.v3+json',
                'Content-Type': 'application/json',
              },
              body: JSON.stringify({ ref: 'SuperBuu38-patch-1' }),
            }
          );
          if (response.ok) {
            setWorkflowStatus('Workflow triggered successfully! Refreshing data...');
            setTimeout(fetchData, 30000); // Wait 30s for workflow to complete
          } else {
            const errorData = await response.json();
            setWorkflowStatus(`Failed to trigger workflow: ${errorData.message}`);
          }
        } catch (err) {
          setWorkflowStatus(`Error: ${err.message}`);
        }
      };

      // Sorting logic
      const sortData = (key) => {
        let direction = 'asc';
        if (sortConfig.key === key && sortConfig.direction === 'asc') {
          direction = 'desc';
        }
        setSortConfig({ key, direction });

        const sorted = [...nfts].sort((a, b) => {
          if (key === 'price') {
            return direction === 'asc'
              ? parseFloat(a[key]) - parseFloat(b[key])
              : parseFloat(b[key]) - parseFloat(a[key]);
          }
          return direction === 'asc'
            ? a[key].localeCompare(b[key])
            : b[key].localeCompare(a[key]);
        });
        setNfts(sorted);
      };

      // Render sortable column header
      const renderHeader = (label, key) => (
        <th
          className="px-4 py-2 text-left cursor-pointer hover:bg-gray-200"
          onClick={() => sortData(key)}
        >
          {label}
          {sortConfig.key === key && (
            <span>{sortConfig.direction === 'asc' ? ' ▲' : ' ▼'}</span>
          )}
        </th>
      );

      if (loading) return <div className="text-center text-xl">Loading...</div>;
      if (error) return <div className="text-center text-red-500">Error: {error}</div>;

      return (
        <div className="bg-white shadow-lg rounded-lg p-6">
          <h1 className="text-2xl font-bold mb-4 text-center">NFT Marketplace</h1>
          <div className="mb-4 flex items-center justify-between">
            <div className="flex items-center space-x-2">
              <input
                type="password"
                placeholder="Enter GitHub PAT"
                value={pat}
                onChange={(e) => setPat(e.target.value)}
                className="border rounded px-2 py-1"
              />
              <button
                onClick={triggerWorkflow}
                className="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600 flex items-center"
              >
                <svg className="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                Refresh
              </button>
            </div>
            <div className="text-sm text-gray-600">{workflowStatus}</div>
          </div>
          <div className="overflow-x-auto">
            <table className="w-full table-auto border-collapse">
              <thead className="bg-gray-100">
                <tr>
                  {renderHeader('Rarity', 'rarity')}
                  {renderHeader('Level', 'level')}
                  {renderHeader('Name', 'name')}
                  {renderHeader('Price', 'price')}
                  <th className="px-4 py-2 text-left">Seller</th>
                  <th className="px-4 py-2 text-left">Sale ID</th>
                  <th className="px-4 py-2 text-left">Timestamp</th>
                  <th className="px-4 py-2 text-left">Status</th>
                  <th className="px-4 py-2 text-left">Link</th>
                </tr>
              </thead>
              <tbody>
                {nfts.map((nft, index) => (
                  <tr key={nft.sale_id} className={index % 2 === 0 ? 'bg-gray-50' : ''}>
                    <td className="border px-4 py-2">{nft.rarity}</td>
                    <td className="border px-4 py-2">{nft.level}</td>
                    <td className="border px-4 py-2">{nft.name}</td>
                    <td className="border px-4 py-2">{nft.price}</td>
                    <td className="border px-4 py-2">{nft.seller}</td>
                    <td className="border px-4 py-2">{nft.sale_id}</td>
                    <td className="border px-4 py-2">{new Date(nft.timestamp).toLocaleString()}</td>
                    <td className="border px-4 py-2">{nft.status}</td>
                    <td className="border px-4 py-2">
                      <a href={nft.sale_link} className="text-blue-500 hover:underline" target="_blank" rel="noopener noreferrer">
                        View Sale
                      </a>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    };

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
