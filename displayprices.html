<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NFT Marketplace</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/babel-standalone@7/babel.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center">
  <div id="root" class="w-full max-w-7xl mx-auto p-6"></div>
  <script type="text/babel">
    const { useState, useEffect } = React;

    const App = () => {
      const [nfts, setNfts] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [sortConfig, setSortConfig] = useState({ key: 'rarity', direction: 'asc' });

      // Fetch JSON data
      const fetchData = async () => {
        try {
          setLoading(true);
          const response = await fetch('https://raw.githubusercontent.com/SuperBuu38/superbuu/SuperBuu38-patch-1/data.json');
          if (!response.ok) throw new Error('Failed to fetch data');
          const data = await response.json();
          // Sort by rarity by default
          const sortedData = [...data].sort((a, b) => a.rarity.localeCompare(b.rarity));
          setNfts(sortedData);
          setLoading(false);
        } catch (err) {
          setError(err.message);
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchData();
      }, []);

      // Sorting logic
      const sortData = (key) => {
        let direction = 'asc';
        if (sortConfig.key === key && sortConfig.direction === 'asc') {
          direction = 'desc';
        }
        setSortConfig({ key, direction });

        const sorted = [...nfts].sort((a, b) => {
          if (key === 'price' || key === 'level') {
            return direction === 'asc'
              ? parseFloat(a[key]) - parseFloat(b[key])
              : parseFloat(b[key]) - parseFloat(a[key]);
          }
          return direction === 'asc'
            ? a[key].localeCompare(b[key])
            : b[key].localeCompare(a[key]);
        });
        setNfts(sorted);
      };

      // Render sortable column header
      const renderHeader = (label, key) => (
        <th
          className="px-6 py-3 text-left text-sm font-semibold text-gray-700 uppercase tracking-wider cursor-pointer hover:bg-gray-200"
          onClick={() => sortData(key)}
        >
          {label}
          {sortConfig.key === key && (
            <span className="ml-1">{sortConfig.direction === 'asc' ? '▲' : '▼'}</span>
          )}
        </th>
      );

      if (loading) return <div className="text-center text-2xl text-gray-600">Loading...</div>;
      if (error) return <div className="text-center text-red-500 text-xl">Error: {error}</div>;

      return (
        <div className="bg-white shadow-xl rounded-lg p-8">
          <h1 className="text-3xl font-bold mb-6 text-center text-gray-800">NFT Marketplace</h1>
          <div className="overflow-x-auto">
            <table className="w-full table-auto border-collapse">
              <thead className="bg-gray-200">
                <tr>
                  {renderHeader('Rarity', 'rarity')}
                  {renderHeader('Level', 'level')}
                  {renderHeader('Name', 'name')}
                  {renderHeader('Price', 'price')}
                  <th className="px-6 py-3 text-left text-sm font-semibold text-gray-700 uppercase tracking-wider">Seller</th>
                  <th className="px-6 py-3 text-left text-sm font-semibold text-gray-700 uppercase tracking-wider">Sale ID</th>
                  <th className="px-6 py-3 text-left text-sm font-semibold text-gray-700 uppercase tracking-wider">Timestamp</th>
                  <th className="px-6 py-3 text-left text-sm font-semibold text-gray-700 uppercase tracking-wider">Status</th>
                  <th className="px-6 py-3 text-left text-sm font-semibold text-gray-700 uppercase tracking-wider">Link</th>
                </tr>
              </thead>
              <tbody>
                {nfts.map((nft, index) => (
                  <tr key={nft.sale_id} className={index % 2 === 0 ? 'bg-gray-50' : 'bg-white'}>
                    <td className="border-t px-6 py-4 text-gray-900">{nft.rarity}</td>
                    <td className="border-t px-6 py-4 text-gray-900">{nft.level}</td>
                    <td className="border-t px-6 py-4 text-gray-900">{nft.name}</td>
                    <td className="border-t px-6 py-4 text-gray-900">{parseFloat(nft.price).toFixed(4)}</td>
                    <td className="border-t px-6 py-4 text-gray-900">{nft.seller}</td>
                    <td className="border-t px-6 py-4 text-gray-900">{nft.sale_id}</td>
                    <td className="border-t px-6 py-4 text-gray-900">{new Date(nft.timestamp).toLocaleString()}</td>
                    <td className="border-t px-6 py-4 text-gray-900">{nft.status}</td>
                    <td className="border-t px-6 py-4">
                      <a
                        href={nft.sale_link}
                        className="text-blue-600 hover:text-blue-800 hover:underline"
                        target="_blank"
                        rel="noopener noreferrer"
                      >
                        View Sale
                      </a>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      );
    };

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
