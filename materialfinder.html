<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Material Finder</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 40px;
      background-color: #f5f5f5;
      color: #333;
    }
    h1 {
      text-align: center;
    }
    h2 {
      margin-top: 40px;
    }
    select {
      margin-bottom: 20px;
      padding: 8px;
      width: 300px;
      font-size: 14px;
    }
    table {
      border-collapse: collapse;
      width: 100%;
      margin-top: 20px;
      background-color: #fff;
      border: 1px solid #ccc;
    }
    th, td {
      text-align: left;
      padding: 10px;
      vertical-align: top;
    }
    tr:nth-child(even) {
      background-color: #f0f0f0;
    }
    td.label {
      font-weight: bold;
      width: 150px;
    }
    .container {
      max-width: 1000px;
      margin: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Material Finder</h1>

    <h2>Materials available in Aperta only</h2>
    <select id="apertaSelect">
      <option value="">-- Select a material --</option>
    </select>

    <h2>Materials available in both Aperta + Land</h2>
    <select id="apertaLandSelect">
      <option value="">-- Select a material --</option>
    </select>

    <h2>Materials available in SD only</h2>
    <select id="sdSelect">
      <option value="">-- Select a material --</option>
    </select>

    <div id="materialDetails"></div>
  </div>

  <script>
    let materials = [];

    fetch('https://raw.githubusercontent.com/SuperBuu38/superbuu/SuperBuu38-patch-1/enhanced_materials.json')
      .then(response => response.json())
      .then(data => {
        materials = data;
        populateDropdowns();
      });

    function populateDropdowns() {
      const aperta = materials.filter(m => m.source === "aperta");
      const apertaLand = materials.filter(m => m.source === "aperta_land");
      const sd = materials.filter(m => m.source === "sd");

      addOptions("apertaSelect", aperta);
      addOptions("apertaLandSelect", apertaLand);
      addOptions("sdSelect", sd);
    }

    function addOptions(selectId, materialList) {
      const select = document.getElementById(selectId);
      materialList
        .sort((a, b) => a.name.localeCompare(b.name))
        .forEach(material => {
          const option = document.createElement("option");
          option.value = material.id;
          option.text = material.name;
          select.appendChild(option);
        });

      select.addEventListener("change", () => {
        const selectedId = parseInt(select.value);
        const material = materials.find(m => m.id === selectedId);
        showMaterialDetails(material);
      });
    }

    function showMaterialDetails(material) {
      if (!material) {
        document.getElementById("materialDetails").innerHTML = "";
        return;
      }

      const rows = [
        formatRow("ID", material.id),
        formatRow("Name", material.name),
        formatRow("Rarity", material.rarity),
        formatRow("Type", material.type),
        formatRow("Source", material.source),
        formatRow("Description", formatDescription(material.description)),
        formatRow("Locations", material.locations),
        formatRow("Zones", material.zones),
        formatRow("Land Location", material.land_location),
      ];

      document.getElementById("materialDetails").innerHTML = `
        <table>
          ${rows.join("")}
        </table>
      `;
    }

    function formatRow(label, value) {
      if (!value || (Array.isArray(value) && value.length === 0)) return '';
      let formattedValue = Array.isArray(value) ? value.join(', ') : value;
      if (label === 'Description') {
        formattedValue = formatDescription(formattedValue);
      }
      return `
        <tr>
          <td class="label">${label}</td>
          <td>${formattedValue}</td>
        </tr>
      `;
    }

    function formatDescription(text) {
      if (typeof text !== 'string') return '';
      const maxLength = 90;
      const regex = new RegExp(`(.{1,${maxLength}})(\\s|$)`, 'g');
      return text.match(regex).map(line => `<div>${line.trim()}</div>`).join('');
    }
  </script>
</body>
</html>
